[project]
name = "sherlock-backend"
version = "0.1.0"
description = "FastAPI backend for Sherlock, an AI data analyst SaaS."
requires-python = ">=3.11,<3.15"
dependencies = [
    "alembic>=1.18.0",
    "asyncpg>=0.31.0",
    "boto3>=1.42.0",
    "email-validator>=2.3.0",
    "fastapi[standard]>=0.135.0",
    "greenlet>=3.3.0",
    "httpx>=0.28.0",
    "langchain>=1.2.0",
    "langchain-aws>=1.4.0",
    "langgraph>=1.1.0",
    "langgraph-checkpoint-postgres>=3.0.0",
    "openpyxl>=3.1.0",
    "pandas>=3.0.0",
    "passlib[bcrypt]>=1.7.4",
    "pgvector>=0.4.0",
    "psycopg[binary]>=3.2.0",
    "pydantic-settings>=2.13.0",
    "python-dotenv>=1.2.0",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.22",
    "sqlalchemy>=2.0.0",
    "sqlglot>=27.0.0",
    "uvicorn[standard]>=0.38.0",
]

[project.optional-dependencies]
notebooks = [
    "ipykernel>=7.0.0",
    "jupyterlab>=4.0.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "pytest>=9.0.0",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.14.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
