name: sherlock-dev

services:
  provision-readonly:
    image: postgres:16-alpine
    command: ["sh", "/scripts/provision-readonly.sh"]
    environment:
      POSTGRES_USER: sherlock_admin
      POSTGRES_PASSWORD: change_me
      POSTGRES_DB: sherlock_db
      POSTGRES_READONLY_PASSWORD: change_me
    volumes:
      - ./infra/postgres/provision-readonly.sh:/scripts/provision-readonly.sh:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  postgres:
    image: pgvector/pgvector:pg16
    container_name: sherlock_postgres_dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: sherlock_admin
      POSTGRES_PASSWORD: change_me
      POSTGRES_DB: sherlock_db
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - sherlock_postgres_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sherlock_admin -d sherlock_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4-alpine
    container_name: sherlock_redis_dev
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  sherlock_postgres_dev:
